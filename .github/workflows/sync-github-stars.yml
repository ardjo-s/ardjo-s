name: Sync GitHub stars

on:
  pull_request:
    paths:
      - README.md
      - docs/stars/**
      - scripts/sync-github-stars.py
      - scripts/test_github_stars.py
      - .github/workflows/sync-github-stars.yml
  schedule:
    # GitHub has no event for changes to the authenticated user's stars.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh public stars using the curated Sol categories
        env:
          GH_TOKEN: ${{ secrets.GH_STARS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing GH_STARS_TOKEN repository secret" >&2; exit 1; }
          python3 scripts/sync-github-stars.py --output-dir docs/stars

      - name: Commit if the export changed
        run: |
          git add README.md docs/stars
          if git diff --cached --quiet; then
            echo "GitHub stars export unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync GitHub stars"
          git push
