name: Sync GitHub stars

on:
  schedule:
    # GitHub has no event for changes to the authenticated user's stars/lists.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without committing generated updates
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, celesto-micro]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Export stars and Star Lists
        env:
          GH_TOKEN: ${{ secrets.GH_STARS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing GH_STARS_TOKEN repository secret" >&2; exit 1; }
          python3 scripts/sync-github-stars.py --output-dir docs/stars

      - name: Commit if the export changed
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          if git diff --quiet -- docs/stars; then
            echo "GitHub stars export unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stars
          git commit -m "chore: sync GitHub stars"
          git push
