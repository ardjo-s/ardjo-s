name: Sync GitHub stars

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - llms.txt
      - docs/stars/**
      - scripts/README-stars.md
      - scripts/sync-github-stars.py
      - scripts/classify-github-stars.py
      - scripts/test_github_stars.py
      - scripts/test_star_classifier.py
      - scripts/testdata/**
      - .github/workflows/sync-github-stars.yml
      - .github/workflows/classify-github-stars.yml
  schedule:
    # GitHub has no event for changes to the authenticated user's stars.
    # Target every 10 minutes so a new star can be published in about 15 minutes
    # (sync + classify + squash-merge). Hosted-runner schedules on this repo have
    # historically been delayed to every 4–8 hours, even with an hourly cron;
    # `*/15` was similarly delayed. Keep the 10-minute cron anyway: when GitHub
    # does honour it, that is the intended latency.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-stars-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/sync-github-stars.py --output-dir docs/stars --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh public stars using the curated Sol categories
        env:
          GH_TOKEN: ${{ secrets.GH_STARS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing GH_STARS_TOKEN repository secret" >&2; exit 1; }
          python3 scripts/sync-github-stars.py --output-dir docs/stars

      - name: Commit if the export changed
        run: |
          git add README.md docs/stars
          if git diff --cached --quiet; then
            echo "GitHub stars export unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync GitHub stars"
          git push
