name: Sync GitHub stars

on:
  schedule:
    # GitHub has no event for changes to the authenticated user's stars/lists.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export stars and Star Lists
        env:
          GH_TOKEN: ${{ secrets.GH_STARS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing GH_STARS_TOKEN repository secret" >&2; exit 1; }
          python3 scripts/sync-github-stars.py --output-dir docs/stars

      - name: Commit if the export changed
        run: |
          if git diff --quiet -- docs/stars; then
            echo "GitHub stars export unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stars
          git commit -m "chore: sync GitHub stars"
          git push
