name: Refresh Tokscale embed on profile README

on:
  schedule:
    # 07:00 and 19:00 UTC — aligns with local tokscale sync every 12h
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-embed-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump embed cache-buster in README
        run: |
          EMBED_V=$(date -u +%Y%m%d%H)
          echo "EMBED_V=$EMBED_V" >> "$GITHUB_ENV"
          perl -pi -e "s/&v=[0-9]*/&v=$EMBED_V/g" README.md
          grep -q "v=${EMBED_V}" README.md
          # Fail loudly if perl did not write YYYYMMDDHH (empty $EMBED_V broke bumps in May 2026).
          grep -qE "&v=[0-9]{10}" README.md

      - name: Commit if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged (same cache day)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh Tokscale embed cache (${EMBED_V})"
          git push
