name: Refresh Tokscale embed on profile README

on:
  schedule:
    # Bust GitHub image cache twice daily (UTC). Pair with local tokscale sync (see scripts/).
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-embed-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump embed cache-buster in README
        run: |
          echo "EMBED_V=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"
          perl -0pi -e 's|(src="https://tokscale\.ai/api/embed/ardjo-s/svg\?view=3d&theme=dark&)v=[^"]+|$1v='"$EMBED_V"'"|g' README.md
          grep -q "v=$EMBED_V" README.md

      - name: Commit if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged (same cache hour)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh Tokscale embed cache (${EMBED_V})"
          git push
