name: Refresh Tokscale profile images

on:
  schedule:
    # Avoid the busy top of the hour. GitHub schedules can still be delayed.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tokscale-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-images:
    # Standard hosted runners are free for this public repository.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate both cards
        run: python3 scripts/refresh-tokscale-embed.py

      - name: Publish changed images
        run: |
          git add assets/tokscale/light.svg assets/tokscale/dark.svg
          if git diff --cached --quiet; then
            echo "Tokscale images unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Tokscale profile images"
          # The stars workflow may have pushed while we downloaded the images.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
